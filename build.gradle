plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.1'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'ua.danyazero'
version = '0.0.1-SNAPSHOT'
description = 'obsession-starter'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
	maven { url = uri('https://jitpack.io') }
}

dependencies {
    implementation 'com.github.obsession-framework.obsession:spring:v0.1.1'
    annotationProcessor 'com.github.obsession-framework.obsession:compiler:v0.1.1'

    implementation 'org.springframework.boot:spring-boot-starter-web'
}

tasks.named('test') {
	useJUnitPlatform()
}
